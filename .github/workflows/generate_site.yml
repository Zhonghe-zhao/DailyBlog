name: Deploy static content to Pages

on:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - labeled
      - unlabeled
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - config.toml
      - site_overrides/**
      - scripts/**
      - .github/workflows/generate_site.yml

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISITE_VERSION: v0.2.6
      ZOLA_VERSION: v0.20.0
      USER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      BASE_URL: https://blog.zhaozhonghe.me # change to your own domain
      # Change to below if you are using GitHub Pages
      # BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate markdown
        run: |
          gh release download $ISITE_VERSION --repo kemingy/isite -p '*linux_amd64*' -O- | tar -xz -C /tmp
          mv /tmp/isite /usr/local/bin
          isite generate --engine zola --user "$USER" --repo "$REPO" --creator "$USER" --title "Zhonghe's Time Archive" --base-url "$BASE_URL" --katex
          cp config.toml output/config.toml
          mkdir -p output/templates output/static output/content
          cp -R site_overrides/templates/. output/templates/
          cp -R site_overrides/static/. output/static/
          cp -R site_overrides/content/. output/content/
          python3 scripts/prepare_site.py output
          gh release download $ZOLA_VERSION --repo getzola/zola -p '*x86_64-unknown-linux*' -O- | tar -xz -C /tmp
          mv /tmp/zola /usr/local/bin
          cd output && zola check --skip-external-links && zola build --base-url "$BASE_URL"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist repository
          name: pages-artifact
          path: 'output/public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-artifact
