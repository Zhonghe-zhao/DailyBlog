name: Generate GitBlog README

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches:
      - main
    paths:
      - main.py
      - config.toml
      - requirements.txt
      - .github/workflows/generate_readme.yml

permissions:
  contents: write
  issues: read

jobs:
  sync:
    name: Generate README
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.repository_owner_id == github.event.issue.user.id
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate new md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python main.py "$GITHUB_TOKEN" "${{ github.repository }}" --issue_number "$ISSUE_NUMBER"

      - name: Push README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p BACKUP
          git add README.md feed.xml BACKUP/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m 'chore: sync blog content'
            git push
          fi
